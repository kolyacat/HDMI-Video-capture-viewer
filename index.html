<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS2 HDMI Screen Viewer</title>
  <style>
    :root {
      --bg-color: #131316;
      --surface-color: #1c1b1f;
      --card-bg: #2b2930;
      --primary: #d0bcff;
      --primary-container: #4a4458;
      --on-primary-container: #e8def8;
      --accent: #a8c7fa;
      --text-main: #e6e1e5;
      --text-sub: #cac4d0;
      --border-color: #49454f;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-pill: 100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--surface-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; color: var(--primary); }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    select, button {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select:hover, button:hover { background-color: var(--primary-container); border-color: var(--primary); }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .viewport-frame {
      width: 100%;
      max-width: min(100vw - 32px, (100vh - 160px) * (16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    :fullscreen .viewport-frame, body:-webkit-full-screen .viewport-frame {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: crisp-edges;
      transition: transform 0.05s linear;
    }

    .controls-bar {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .btn-primary { background-color: var(--primary); color: #381e72; font-weight: 600; border: none; }
    .btn-primary:hover { background-color: #e8def8; }

    .drawer {
      position: fixed;
      right: -360px;
      top: 0;
      width: 340px;
      height: 100vh;
      background: var(--surface-color);
      border-left: 1px solid var(--border-color);
      padding: 24px;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
      transition: right 0.3s ease;
      z-index: 100;
      overflow-y: auto;
    }
    .drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .setting-group { margin-bottom: 18px; }
    .setting-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
    .setting-group input[type="range"] { width: 100%; accent-color: var(--primary); }

    .toast {
      position: absolute;
      top: 20px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🎮</span> <span id="appTitle">PS2 Viewer</span>
    </div>
    <div class="header-actions">
      <select id="videoSourceSelect"></select>
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="id">🇮🇩 Indonesia</option>
        <option value="su">🇮🇩 Sunda</option>
      </select>
      <button class="btn-primary" id="btnConnect" onclick="startStream()">Connect</button>
    </div>
  </header>

  <div class="main-container">
    <div id="toast" class="toast">Settings updated</div>
    
    <div class="viewport-frame" id="viewport">
      <video id="videoElement" autoplay playsinline></video>
    </div>

    <div class="controls-bar">
      <button onclick="setMode('43')" id="btn43">4:3 Native</button>
      <button onclick="setMode('169')" id="btn169">16:9 Fit</button>
      <button onclick="setMode('crop')" id="btnCrop">Crop Edges</button>
      <button onclick="setMode('stretch')" id="btnStretch">Full Stretch</button>
      <button onclick="toggleFullscreen()" id="btnFull">Fullscreen</button>
      <button onclick="takeScreenshot()" id="btnSnap">Screenshot</button>
      <button onclick="toggleDrawer()" id="btnSettings">⚙️ Settings</button>
    </div>
  </div>

  <!-- Settings Drawer -->
  <div class="drawer" id="settingsDrawer">
    <div class="drawer-header">
      <h3 id="txtSettingsTitle">Settings</h3>
      <button onclick="toggleDrawer()" style="padding: 4px 10px;">✕</button>
    </div>

    <div class="setting-group">
      <label id="lblZoom">Zoom Level (1.0 - 2.0)</label>
      <input type="range" id="zoomVal" min="1" max="2" step="0.02" value="1" oninput="updateTransform()">
    </div>
    <div class="setting-group">
      <label id="lblPanX">Pan Horizontal (X)</label>
      <input type="range" id="panXVal" min="-200" max="200" step="2" value="0" oninput="updateTransform()">
    </div>
    <div class="setting-group">
      <label id="lblPanY">Pan Vertical (Y)</label>
      <input type="range" id="panYVal" min="-200" max="200" step="2" value="0" oninput="updateTransform()">
    </div>
    <div class="setting-group">
      <label id="lblBright">Brightness</label>
      <input type="range" id="brightVal" min="0.5" max="1.5" step="0.05" value="1" oninput="updateFilters()">
    </div>
    <div class="setting-group">
      <label id="lblContrast">Contrast</label>
      <input type="range" id="contrastVal" min="0.5" max="1.5" step="0.05" value="1" oninput="updateFilters()">
    </div>
    <div class="setting-group">
      <label id="lblVolume">Volume Gain Boost</label>
      <input type="range" id="volumeVal" min="0" max="2" step="0.1" value="1" oninput="updateVolume()">
    </div>
    <button onclick="resetAdjustments()" style="width: 100%; justify-content: center; margin-top: 10px;" id="btnReset">Reset All</button>
  </div>

  <script>
    const i18n = {
      en: {
        title: "PS2 Viewer",
        connect: "Connect",
        disconnect: "Disconnect",
        mode43: "4:3 Native",
        mode169: "16:9 Fit",
        crop: "Crop Edges",
        stretch: "Full Stretch",
        full: "Fullscreen",
        snap: "Screenshot",
        settings: "⚙️ Settings",
        settingsTitle: "Settings",
        zoom: "Zoom Level",
        panX: "Pan Horizontal (X)",
        panY: "Pan Vertical (Y)",
        bright: "Brightness",
        contrast: "Contrast",
        volume: "Volume Gain Boost",
        reset: "Reset All",
        connected: "Capture card connected!",
        error: "Unable to access video device"
      },
      id: {
        title: "Penampil PS2",
        connect: "Hubungkan",
        disconnect: "Putuskan",
        mode43: "4:3 Asli",
        mode169: "16:9 Pas",
        crop: "Potong Pinggir",
        stretch: "Layar Penuh",
        full: "Layar Penuh (F)",
        snap: "Tangkapan Layar",
        settings: "⚙️ Pengaturan",
        settingsTitle: "Pengaturan Display",
        zoom: "Tingkat Zoom",
        panX: "Geser Kiri/Kanan (X)",
        panY: "Geser Atas/Bawah (Y)",
        bright: "Kecerahan",
        contrast: "Kontras",
        volume: "Penguat Volume",
        reset: "Reset Pengaturan",
        connected: "Capture card terhubung!",
        error: "Gagal mengakses capture card"
      },
      su: {
        title: "Panyawang PS2",
        connect: "Sambungkeun",
        disconnect: "Pegatkeun",
        mode43: "4:3 Asli",
        mode169: "16:9 Pas",
        crop: "Kerat Sisi Hideung",
        stretch: "Layar Pinuh",
        full: "Layar Pinuh (F)",
        snap: "Potrét Layar",
        settings: "⚙️ Setelan",
        settingsTitle: "Setelan Layar",
        zoom: "Tingkat Zoom",
        panX: "Kénca/Katuhu (X)",
        panY: "Luhur/Handap (Y)",
        bright: "Cahaya",
        contrast: "Bédana Warna",
        volume: "Penguat Swara",
        reset: "Puleangkeun",
        connected: "Capture card parantos disambungkeun!",
        error: "Teu tiasa muka capture card"
      }
    };

    let currentLang = localStorage.getItem('ps2_lang') || 'en';
    let currentStream = null;
    let audioCtx = null;
    let gainNode = null;
    let currentFit = 'contain';

    const video = document.getElementById('videoElement');

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('ps2_lang', lang);
      document.getElementById('langSelect').value = lang;

      const t = i18n[lang];
      document.getElementById('appTitle').innerText = t.title;
      document.getElementById('btnConnect').innerText = currentStream ? t.disconnect : t.connect;
      document.getElementById('btn43').innerText = t.mode43;
      document.getElementById('btn169').innerText = t.mode169;
      document.getElementById('btnCrop').innerText = t.crop;
      document.getElementById('btnStretch').innerText = t.stretch;
      document.getElementById('btnFull').innerText = t.full;
      document.getElementById('btnSnap').innerText = t.snap;
      document.getElementById('btnSettings').innerText = t.settings;
      document.getElementById('txtSettingsTitle').innerText = t.settingsTitle;
      document.getElementById('lblZoom').innerText = t.zoom;
      document.getElementById('lblPanX').innerText = t.panX;
      document.getElementById('lblPanY').innerText = t.panY;
      document.getElementById('lblBright').innerText = t.bright;
      document.getElementById('lblContrast').innerText = t.contrast;
      document.getElementById('lblVolume').innerText = t.volume;
      document.getElementById('btnReset').innerText = t.reset;
    }

    async function getDevices() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoSelect = document.getElementById('videoSourceSelect');
      videoSelect.innerHTML = '';
      devices.filter(d => d.kind === 'videoinput').forEach(device => {
        const opt = document.createElement('option');
        opt.value = device.deviceId;
        opt.text = device.label || `Capture Card (${videoSelect.length + 1})`;
        videoSelect.appendChild(opt);
      });
    }

    async function startStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
        video.srcObject = null;
        changeLanguage(currentLang);
        return;
      }

      const deviceId = document.getElementById('videoSourceSelect').value;
      const constraints = {
        video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        // Raw Stereo Audio setup
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(currentStream);
        gainNode = audioCtx.createGain();
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        document.getElementById('btnConnect').innerText = i18n[currentLang].disconnect;
        showToast(i18n[currentLang].connected);
      } catch (err) {
        showToast(i18n[currentLang].error);
      }
    }

    function setMode(mode) {
      if (mode === '43') {
        video.style.objectFit = 'contain';
        video.style.aspectRatio = '4 / 3';
      } else if (mode === '169') {
        video.style.objectFit = 'contain';
        video.style.aspectRatio = '16 / 9';
      } else if (mode === 'crop') {
        video.style.objectFit = 'cover';
        video.style.aspectRatio = '16 / 9';
      } else if (mode === 'stretch') {
        video.style.objectFit = 'fill';
        video.style.aspectRatio = 'auto';
      }
    }

    function updateTransform() {
      const zoom = document.getElementById('zoomVal').value;
      const panX = document.getElementById('panXVal').value;
      const panY = document.getElementById('panYVal').value;
      video.style.transform = `scale(${zoom}) translate(${panX}px, ${panY}px)`;
    }

    function updateFilters() {
      const bright = document.getElementById('brightVal').value;
      const contrast = document.getElementById('contrastVal').value;
      video.style.filter = `brightness(${bright}) contrast(${contrast})`;
    }

    function updateVolume() {
      if (gainNode) gainNode.gain.value = document.getElementById('volumeVal').value;
    }

    function resetAdjustments() {
      document.getElementById('zoomVal').value = 1;
      document.getElementById('panXVal').value = 0;
      document.getElementById('panYVal').value = 0;
      document.getElementById('brightVal').value = 1;
      document.getElementById('contrastVal').value = 1;
      document.getElementById('volumeVal').value = 1;
      updateTransform();
      updateFilters();
      updateVolume();
      setMode('43');
    }

    function toggleFullscreen() {
      const elem = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => {});
      } else {
        document.exitFullscreen();
      }
    }

    function takeScreenshot() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1920;
      canvas.height = video.videoHeight || 1080;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const link = document.createElement('a');
      link.download = `PS2_Screenshot_${Date.now()}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }

    function toggleDrawer() {
      document.getElementById('settingsDrawer').classList.toggle('open');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    navigator.mediaDevices.addEventListener('devicechange', getDevices);
    getDevices();
    changeLanguage(currentLang);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 's' || e.key === 'S') takeScreenshot();
      if (e.key === 'r' || e.key === 'R') resetAdjustments();
    });
  </script>
</body>
</html>
